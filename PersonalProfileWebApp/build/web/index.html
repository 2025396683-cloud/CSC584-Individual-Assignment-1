
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Personal Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="bg-shape top-left"></div>
    <div class="bg-shape bottom-right"></div>

    <div class="container">

        <div class="title-wrapper">
            <h1>My Personal Profile</h1>
        </div>

        <p class="subtitle">
            Please fill in your personal information below.
        </p>

        <div class="card">

            <form action="ProfileServlet" method="post">

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name"
                           placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" name="studentId"
                           placeholder="Enter your student ID" required>
                </div>

                <div class="form-group">
                    <label>Programme</label>
                    <input type="text" name="programme"
                           placeholder="Enter your programme" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email"
                           placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label>Hobbies</label>
                    <input type="text" name="hobbies"
                           placeholder="e.g. Reading, Travelling, Music"
                           required>
                </div>

                <div class="form-group">
                    <label>Short Self-Introduction</label>
                    <textarea name="introduction" rows="4"
                              placeholder="Tell us about yourself..."
                              required></textarea>
                </div>

                <button type="submit" class="btn-submit">
                    Submit Profile
                </button>

            </form>

        </div>

        <p class="footer-text">
            Made with love
        </p>

    </div>

</body>
</html>
